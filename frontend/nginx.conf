server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The /api/buoys snapshot is polled every 60 s and was served uncompressed:
    # 534 KB raw vs 54 KB gzipped. gzip_proxied any so responses also compress
    # when the request arrives through a proxy (e.g. the Cloudflare tunnel).
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
